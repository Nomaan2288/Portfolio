<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <rect width="160" height="120" rx="16" fill="#ffffff"/>
  <g transform="translate(20, 10)">
    <!-- ISRO Satellite / Rocket Chevron Mark -->
    <!-- Central Orange Arrow -->
    <path fill="#f97316" d="M60 4 L48 50 L60 42 L72 50 Z" />
    <polygon points="56,30 40,30 36,36 54,36" fill="#3b82f6"/>
    <polygon points="64,30 80,30 84,36 66,36" fill="#3b82f6"/>
    <polygon points="58,20 44,20 42,24 57,24" fill="#3b82f6"/>
    <polygon points="62,20 76,20 78,24 63,24" fill="#3b82f6"/>

